name: Go Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  go-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build test packages with go.mod Go version
        run: ./scripts/test-go-compat.sh